<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <title>SpectraFlux Logo</title>
  <desc>The High-Velocity WebAssembly Execution Chassis</desc>
  <rect width="1024" height="1024" fill="#000000"/>
  
  <!-- Spartan Flux Capacitor Mark -->
  <defs>
    <g id="conduit-blade-pair">
      <!-- Left Blade: chevron notch cut -->
      <polygon points="505,432 505,665 440,730 440,470" />
      <!-- Right Blade: chevron notch cut -->
      <polygon points="519,432 519,665 584,730 584,470" />
    </g>
  </defs>

  <!-- Conduit 1: Bottom (Vibrant Neon Coral #FF5500) -->
  <g fill="#FF5500">
    <use href="#conduit-blade-pair" />
  </g>

  <!-- Conduit 2: Top-Left (Crisp White #FFFFFF) - 120° rotation around (512, 420) -->
  <g fill="#FFFFFF" transform="rotate(120, 512, 420)">
    <use href="#conduit-blade-pair" />
  </g>

  <!-- Conduit 3: Top-Right (Electric Cyan #00F0FF) - 240° rotation around (512, 420) -->
  <g fill="#00F0FF" transform="rotate(240, 512, 420)">
    <use href="#conduit-blade-pair" />
  </g>

  <!-- Wordmark matching SpectraGQL typography -->
  <text x="512" y="885" text-anchor="middle" font-family="system-ui, -apple-system, 'SF Pro Display', Roboto, 'Segoe UI', sans-serif" font-weight="800" font-size="74" letter-spacing="1.5">
    <tspan fill="#FFFFFF">SPECTRA</tspan><tspan fill="#FF5500">FLUX</tspan>
  </text>
</svg>
