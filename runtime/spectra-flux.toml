# SpectraFlux Default Configuration

port = 8081
host = "0.0.0.0"
gateway_admin_url = "http://127.0.0.1:8000"

[broker]
method = "nats"
addr = "nats://127.0.0.1:4222"
consumer_group = "spectra-flux-workers"

[internal-storage]
url = "kevy://embedded"

[fluxcell-storage]
url = "kevy:///data/fluxcell-storage.kevy"
# url = "redis://127.0.0.1:6379" # For external Redis/Valkey cluster

[database]
url = "postgresql://postgres:password@localhost:5432/spectraflux"
max_connections = 16

[profiles.standard]
max_instances = 12
max_memory_mb = 32
timeout_ms = 10000
offload = "blocking_pool"

[profiles.extended]
max_instances = 8
max_memory_mb = 64
timeout_ms = 120000
offload = "blocking_pool"

[profiles.batch]
max_instances = 2
max_memory_mb = 128
timeout_ms = 300000
offload = "dedicated_worker"

[fluxcells.magic_link]
wasm_module = "fluxcells/magic_link.wasm"
mount_path = "/auth"
profile = "extended"
enabled = true

[fluxcells.webhook]
wasm_module = "fluxcells/webhook.wasm"
mount_path = "/api/webhooks"
profile = "extended"
enabled = true

[deployer]
enabled = true
external_deploy_enabled = true
dev_upload_enabled = true
auto_activate = true
storage_dir = "fluxcells"
