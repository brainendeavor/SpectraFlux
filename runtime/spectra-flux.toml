# SpectraFlux Default Configuration

port = 8081
host = "0.0.0.0"
gateway_admin_url = "http://127.0.0.1:8000"

[broker]
method = "nats"
addr = "nats://127.0.0.1:4222"
consumer_group = "spectra-flux-workers"

[storage]
backend = "embedded_kevy"
# addr = "redis://127.0.0.1:6379" # For external Redis/Valkey

[database]
url = "postgresql://postgres:password@localhost:5432/spectraflux"
max_connections = 16

# Example user-defined fluxcell:
# [fluxcells.sample]
# wasm_module = "fluxcells/sample.wasm"
# mount_path = "/sample"
# enabled = false
# profile = "standard"
# subscriptions = ["events.sample"]

[fluxcells.magic_link]
wasm_module = "fluxcells/magic_link.wasm"
mount_path = "/auth"
profile = "standard"
enabled = false

[fluxcells.webhook]
wasm_module = "fluxcells/webhook.wasm"
mount_path = "/api/webhooks"
profile = "standard"
enabled = false

[deployer]
enabled = true
external_deploy_enabled = true
dev_upload_enabled = true
auto_activate = true
storage_dir = "fluxcells"
