[package]
name = "fluxcell-cli"
version = "0.1.0"
edition = "2024"
description = "CLI tool for scaffolding, compiling, testing, and deploying SpectraGQL Fluxcells"
license = "MIT"

[lib]
name = "fluxcell_cli"
path = "src/lib.rs"

[[bin]]
name = "fluxcell"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.0", features = ["full"] }
sha2 = "0.10"
hex = "0.4"
anyhow = "1.0"
